<!doctype html>
<html lang="id" class="gated">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Keamanan: hanya kode dari aplikasi ini sendiri yang boleh berjalan,
       dan data hanya boleh dikirim ke Google Apps Script milikmu. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Lkk Brankas</title>
  <meta name="description" content="Penyimpan email, password & catatan rahasia terenkripsi, tersimpan di Google Sheets-mu.">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lkk Brankas">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="boot.js"></script>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="sp-in">
      <img class="sp-logo" src="icons/favicon.svg" alt="" width="88" height="88">
      <div class="sp-name">Lkk Brankas</div>
      <div class="sp-by">by R</div>
    </div>
    <div class="sp-ver" id="splash-ver"></div>
  </div>
  <div id="app" class="app">
    <header class="topbar" id="topbar"></header>
    <main class="views" id="views">
      <section class="view" data-view="vault" aria-label="Brankas"></section>
      <section class="view" data-view="settings" aria-label="Pengaturan"></section>
    </main>
    <nav class="bottom-nav two" id="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-btn" data-nav="vault"><span data-icon="shield"></span><span>Brankas</span></button>
      <button class="fab" data-action="add" aria-label="Tambah item"><span data-icon="plus"></span></button>
      <button class="nav-btn" data-nav="settings"><span data-icon="settings"></span><span>Pengaturan</span></button>
    </nav>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script src="app.js" defer></script>
